<svg viewBox="-35 -30 70 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .body { stroke: #333; stroke-width: 1.5; fill: #fffacd; }
      .pin { stroke: #333; stroke-width: 1; }
      .label { font-family: sans-serif; font-size: 9px; text-anchor: middle; }
      .pin-label { font-family: sans-serif; font-size: 8px; fill: #666; }
    </style>
  </defs>
  
  <!-- IC 外框 (SOT-23 3引脚样式) -->
  <rect x="-20" y="-25" width="40" height="50" class="body" rx="2"/>
  
  <!-- 引脚 1: Vin (左侧) -->
  <line x1="-35" y1="-15" x2="-20" y2="-15" class="pin" data-pin-id="0" data-pin-name="Vin"/>
  <text x="-28" y="-18" class="pin-label" text-anchor="end">Vin</text>
  
  <!-- 引脚 2: GND (底部) -->
  <line x1="0" y1="25" x2="0" y2="35" class="pin" data-pin-id="1" data-pin-name="GND"/>
  <text x="3" y="32" class="pin-label" text-anchor="start">GND</text>
  
  <!-- 引脚 3: Vout (右侧) -->
  <line x1="20" y1="15" x2="35" y2="15" class="pin" data-pin-id="2" data-pin-name="Vout"/>
  <text x="28" y="12" class="pin-label" text-anchor="start">Vout</text>
  
  <!-- 热点标记 -->
  <circle cx="-35" cy="-15" r="2" fill="#dc3545" opacity="0" class="pin-hotspot" data-pin-id="0"/>
  <circle cx="0" cy="35" r="2" fill="#333" opacity="0" class="pin-hotspot" data-pin-id="1"/>
  <circle cx="35" cy="15" r="2" fill="#dc3545" opacity="0" class="pin-hotspot" data-pin-id="2"/>
  
  <!-- 名称标签位置 -->
  <text x="0" y="-28" class="label name-placeholder" style="display:none;"></text>
  <text x="0" y="42" class="label value-placeholder" style="display:none;"></text>
</svg>
