<!-- DUAL04_UNIFIED_TEMPLATE: Universal 2x4 pin package (8 pins total) -->
<svg viewBox="-53 -35 106 70" xmlns="http://www.w3.org/2000/svg" data-template="dual04">
  <defs>
    <style>
      .body { stroke: #333; stroke-width: 1.5; fill: #f5f5dc; }
      .pin { stroke: #333; stroke-width: 1.2; }
      .pin-number { font-family: sans-serif; font-size: 7px; fill: #666; text-anchor: middle; }
      .pin-dot { fill: #dc3545; opacity: 0; }
      .marker { fill: #333; }
      .pin-name-anchor { fill: none; opacity: 0; }
    </style>
  </defs>

  <!-- IC Body -->
  <rect x="-25" y="-20" width="50" height="40" class="body" rx="2"/>
  <!-- Pin 1 Marker -->
  <circle cx="-17" cy="-15" r="2" class="marker"/>

  <!-- Left Side Pins (1-4) -->
  <line x1="-33" y1="-15" x2="-25" y2="-15" class="pin" data-pin-id="0" data-pin-name="1"/>
  <text x="-36" y="-13" class="pin-number" text-anchor="end">1</text>
  <circle cx="-33" cy="-15" r="2" class="pin-dot" data-pin-id="0"/>
  <circle cx="-33" cy="-15" r="1" class="pin-name-anchor" data-pin-name-anchor="1"/>
  <line x1="-33" y1="-5" x2="-25" y2="-5" class="pin" data-pin-id="1" data-pin-name="2"/>
  <text x="-36" y="-3" class="pin-number" text-anchor="end">2</text>
  <circle cx="-33" cy="-5" r="2" class="pin-dot" data-pin-id="1"/>
  <circle cx="-33" cy="-5" r="1" class="pin-name-anchor" data-pin-name-anchor="2"/>
  <line x1="-33" y1="5" x2="-25" y2="5" class="pin" data-pin-id="2" data-pin-name="3"/>
  <text x="-36" y="7" class="pin-number" text-anchor="end">3</text>
  <circle cx="-33" cy="5" r="2" class="pin-dot" data-pin-id="2"/>
  <circle cx="-33" cy="5" r="1" class="pin-name-anchor" data-pin-name-anchor="3"/>
  <line x1="-33" y1="15" x2="-25" y2="15" class="pin" data-pin-id="3" data-pin-name="4"/>
  <text x="-36" y="17" class="pin-number" text-anchor="end">4</text>
  <circle cx="-33" cy="15" r="2" class="pin-dot" data-pin-id="3"/>
  <circle cx="-33" cy="15" r="1" class="pin-name-anchor" data-pin-name-anchor="4"/>

  <!-- Right Side Pins (5-8) -->
  <line x1="25" y1="-15" x2="33" y2="-15" class="pin" data-pin-id="4" data-pin-name="8"/>
  <text x="36" y="-13" class="pin-number" text-anchor="start">8</text>
  <circle cx="33" cy="-15" r="2" class="pin-dot" data-pin-id="4"/>
  <circle cx="33" cy="-15" r="1" class="pin-name-anchor" data-pin-name-anchor="8"/>
  <line x1="25" y1="-5" x2="33" y2="-5" class="pin" data-pin-id="5" data-pin-name="7"/>
  <text x="36" y="-3" class="pin-number" text-anchor="start">7</text>
  <circle cx="33" cy="-5" r="2" class="pin-dot" data-pin-id="5"/>
  <circle cx="33" cy="-5" r="1" class="pin-name-anchor" data-pin-name-anchor="7"/>
  <line x1="25" y1="5" x2="33" y2="5" class="pin" data-pin-id="6" data-pin-name="6"/>
  <text x="36" y="7" class="pin-number" text-anchor="start">6</text>
  <circle cx="33" cy="5" r="2" class="pin-dot" data-pin-id="6"/>
  <circle cx="33" cy="5" r="1" class="pin-name-anchor" data-pin-name-anchor="6"/>
  <line x1="25" y1="15" x2="33" y2="15" class="pin" data-pin-id="7" data-pin-name="5"/>
  <text x="36" y="17" class="pin-number" text-anchor="start">5</text>
  <circle cx="33" cy="15" r="2" class="pin-dot" data-pin-id="7"/>
  <circle cx="33" cy="15" r="1" class="pin-name-anchor" data-pin-name-anchor="5"/>
</svg>