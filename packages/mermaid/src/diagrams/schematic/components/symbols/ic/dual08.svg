  <line x1="-33" y1="-5" x2="-25" y2="-5" class="pin" data-pin-id="3" data-pin-name="4"/>
  <text x="-36" y="-3" class="pin-number" text-anchor="end">4</text>
  <circle cx="-33" cy="-5" r="2" class="pin-dot" data-pin-id="3"/>
  <circle cx="-33" cy="-5" r="1" class="pin-name-anchor" data-pin-name-anchor="4"/>
  <line x1="-33" y1="5" x2="-25" y2="5" class="pin" data-pin-id="4" data-pin-name="5"/>
  <text x="-36" y="7" class="pin-number" text-anchor="end">5</text>
