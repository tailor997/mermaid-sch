  <circle cx="33" cy="15" r="1" class="pin-name-anchor" data-pin-name-anchor="11"/>
  <line x1="25" y1="25" x2="33" y2="25" class="pin" data-pin-id="14" data-pin-name="10"/>
  <text x="36" y="27" class="pin-number" text-anchor="start">10</text>
