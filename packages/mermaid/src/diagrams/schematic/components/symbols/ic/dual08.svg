  <line x1="25" y1="5" x2="33" y2="5" class="pin" data-pin-id="12" data-pin-name="12"/>
  <text x="36" y="7" class="pin-number" text-anchor="start">12</text>
  <circle cx="33" cy="5" r="2" class="pin-dot" data-pin-id="12"/>
  <circle cx="33" cy="5" r="1" class="pin-name-anchor" data-pin-name-anchor="12"/>
  <line x1="25" y1="15" x2="33" y2="15" class="pin" data-pin-id="13" data-pin-name="11"/>
  <text x="36" y="17" class="pin-number" text-anchor="start">11</text>
