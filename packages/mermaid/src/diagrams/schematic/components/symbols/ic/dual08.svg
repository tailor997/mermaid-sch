<!-- DUAL08_UNIFIED_TEMPLATE: Universal 2x8 pin package (16 pins total) -->
<svg viewBox="-53 -55 106 110" xmlns="http://www.w3.org/2000/svg" data-template="dual08">
  <defs>
    <style>
      .body { stroke: #333; stroke-width: 1.5; fill: #f5f5dc; }
      .pin { stroke: #333; stroke-width: 1.2; }
      .pin-number { font-family: sans-serif; font-size: 7px; fill: #666; text-anchor: middle; }
      .pin-dot { fill: #dc3545; opacity: 0; }
      .marker { fill: #333; }
      .pin-name-anchor { fill: none; opacity: 0; }
    </style>
  </defs>

  <!-- IC Body -->
  <rect x="-25" y="-40" width="50" height="80" class="body" rx="2"/>
  <!-- Pin 1 Marker -->
  <circle cx="-17" cy="-35" r="2" class="marker"/>

  <!-- Left Side Pins (1-8) -->
  <line x1="-33" y1="-35" x2="-25" y2="-35" class="pin" data-pin-id="0" data-pin-name="1"/>
  <text x="-36" y="-33" class="pin-number" text-anchor="end">1</text>
  <circle cx="-33" cy="-35" r="2" class="pin-dot" data-pin-id="0"/>
  <circle cx="-33" cy="-35" r="1" class="pin-name-anchor" data-pin-name-anchor="1"/>
  <line x1="-33" y1="-25" x2="-25" y2="-25" class="pin" data-pin-id="1" data-pin-name="2"/>
