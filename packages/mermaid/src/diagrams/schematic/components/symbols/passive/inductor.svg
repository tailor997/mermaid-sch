<svg viewBox="-35 -15 70 30" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .body { stroke: #333; stroke-width: 1.5; fill: none; stroke-linecap: round; }
      .pin { stroke: #333; stroke-width: 1; }
      .label { font-family: sans-serif; font-size: 10px; text-anchor: middle; }
    </style>
  </defs>
  
  <!-- 左引脚 -->
  <line x1="-35" y1="0" x2="-20" y2="0" class="pin" data-pin-id="0" data-pin-name="left"/>
  
  <!-- 电感线圈 - 弧线样式 -->
  <path d="M -20 0 
           A 5 10 0 0 1 -10 0 
           A 5 10 0 0 1 0 0 
           A 5 10 0 0 1 10 0 
           A 5 10 0 0 1 20 0" 
        class="body" fill="none"/>
  
  <!-- 右引脚 -->
  <line x1="20" y1="0" x2="35" y2="0" class="pin" data-pin-id="1" data-pin-name="right"/>
  
  <!-- 热点标记 -->
  <circle cx="-35" cy="0" r="2" fill="#0066cc" opacity="0" class="pin-hotspot" data-pin-id="0"/>
  <circle cx="35" cy="0" r="2" fill="#0066cc" opacity="0" class="pin-hotspot" data-pin-id="1"/>
  
  <!-- 名称标签位置 -->
  <text x="0" y="-16" class="label name-placeholder" style="display:none;"></text>
  <text x="0" y="26" class="label value-placeholder" style="display:none;"></text>
</svg>
