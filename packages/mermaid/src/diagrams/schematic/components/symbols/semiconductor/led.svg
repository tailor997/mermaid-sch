<svg viewBox="-35 -20 70 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .body { stroke: #333; stroke-width: 1.5; fill: none; }
      .fill { fill: #90EE90; fill-opacity: 0.3; }
      .pin { stroke: #333; stroke-width: 1; }
      .arrow { stroke: #228B22; stroke-width: 1; fill: none; }
      .label { font-family: sans-serif; font-size: 10px; text-anchor: middle; }
    </style>
  </defs>
  
  <!-- 左引脚 (阳极) -->
  <line x1="-35" y1="0" x2="-8" y2="0" class="pin" data-pin-id="0" data-pin-name="anode" data-pin-type="positive"/>
  
  <!-- LED 三角形 -->
  <polygon points="-8,-8 -8,8 8,0" class="body fill"/>
  
  <!-- 竖线 (阴极侧) -->
  <line x1="10" y1="-8" x2="10" y2="8" class="body"/>
  
  <!-- 右引脚 (阴极) -->
  <line x1="10" y1="0" x2="35" y2="0" class="pin" data-pin-id="1" data-pin-name="cathode" data-pin-type="negative"/>
  
  <!-- 发光箭头 -->
  <line x1="2" y1="-10" x2="6" y2="-14" class="arrow"/>
  <polygon points="6,-14 4,-12 7,-12" class="arrow" fill="#228B22"/>
  
  <line x1="6" y1="-8" x2="10" y2="-12" class="arrow"/>
  <polygon points="10,-12 8,-10 11,-10" class="arrow" fill="#228B22"/>
  
  <!-- 热点标记 -->
  <circle cx="-35" cy="0" r="2" fill="#dc3545" opacity="0" class="pin-hotspot" data-pin-id="0"/>
  <circle cx="35" cy="0" r="2" fill="#333" opacity="0" class="pin-hotspot" data-pin-id="1"/>
  
  <!-- 名称标签位置 -->
  <text x="0" y="-16" class="label name-placeholder" style="display:none;"></text>
  <text x="0" y="28" class="label value-placeholder" style="display:none;"></text>
</svg>
